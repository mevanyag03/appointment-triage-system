<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediAI</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0f1e;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 48px 24px 40px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(48px, 8vw, 80px);
      color: #f0f2f8;
      line-height: 1;
      margin-bottom: 10px;
    }

    h1 span { color: #20b2aa; font-style: italic; }

    .subtitle {
      font-size: 12px;
      color: #5a6880;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 24px 24px 0;
    }

    .tab {
      padding: 10px 28px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: #5a6880;
      transition: all 0.2s ease;
      letter-spacing: 0.03em;
    }

    .tab:hover { background: rgba(255,255,255,0.06); color: #aab0bc; }

    .tab.active-triage {
      background: rgba(32,178,170,0.12);
      color: #20b2aa;
      border-color: rgba(32,178,170,0.35);
    }

    .tab.active-xray {
      background: rgba(110,181,255,0.10);
      color: #6eb5ff;
      border-color: rgba(110,181,255,0.3);
    }

    .frame-container {
      padding: 20px 24px 40px;
      display: flex;
      justify-content: center;
    }

    iframe {
      width: 100%;
      max-width: 1100px;
      height: 80vh;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      background: #fff;
    }

    .footer {
      text-align: center;
      padding: 0 0 32px;
      font-size: 11px;
      color: #252e40;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <header>
    <h1>Medi<span>AI</span></h1>
    <p class="subtitle">AI Based Healthcare Assistant</p>
  </header>

  <div class="tabs">
    <button class="tab active-triage" onclick="showApp('triage', this)">🏥 Patient Triage &amp; Appointments</button>
    <button class="tab" onclick="showApp('xray', this)">🫁 Chest X-Ray Analyser</button>
  </div>

  <div class="frame-container">
    <iframe id="appFrame" src="http://localhost:8501" allowfullscreen></iframe>
  </div>

  <div class="footer">For educational and demonstration purposes only</div>

  <script>
    function showApp(app, btn) {
      const frame = document.getElementById('appFrame');
      const tabs = document.querySelectorAll('.tab');

      tabs.forEach(t => t.className = 'tab');

      if (app === 'triage') {
        frame.src = 'http://localhost:8501';
        btn.className = 'tab active-triage';
      } else {
        frame.src = 'http://localhost:8502';
        btn.className = 'tab active-xray';
      }
    }
  </script>

</body>
</html>
